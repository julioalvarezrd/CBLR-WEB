name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cblr:cblr@localhost:5432/cblr?schema=public
      AUTH_SECRET: ci-only-secret-for-build-validation
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cblr
          POSTGRES_USER: cblr
          POSTGRES_PASSWORD: cblr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cblr -d cblr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm prisma:deploy

      - name: RBAC database smoke test
        run: node scripts/ci/rbac-smoke.mjs

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build
